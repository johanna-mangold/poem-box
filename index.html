<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

<!-- p5.js -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>

<style>
/* =========================
   ROOT VARS
   ========================= */
:root{
  --bg:#000;
  --line:  rgba(0,163,255,.18);
  --line2: rgba(0,163,255,.32);
  --cell: 48px;
  --major: calc(var(--cell) * 5);
  --vh: 1vh;
}

/* =========================
   GLOBAL
   ========================= */
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background: var(--bg);
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}

body{
  position: relative;
  height: calc(var(--vh) * 100);
  min-height: 100vh;
  min-height: 100dvh;
}

/* =========================
   MAP
   ========================= */
#viewport{
  position:absolute;
  left:0; top:0;
  width:100%;
  height:100%;
  overflow:hidden;
  cursor: grab;
  touch-action:none;
  background: var(--bg);
}
#viewport:active{ cursor: grabbing; }

#world{
  position:absolute;
  left:0; top:0;
  will-change: transform;
  transform: translate3d(0,0,0);
  transform-origin: 0 0;
  z-index:10;
}

#grid{
  position:absolute;
  inset:-12px;
  pointer-events:none;
  z-index:5;
  background: var(--bg);
  background-image:
    repeating-linear-gradient(to right,
      transparent 0,
      transparent calc(var(--cell) - 1px),
      var(--line) calc(var(--cell) - 1px),
      var(--line) var(--cell)
    ),
    repeating-linear-gradient(to bottom,
      transparent 0,
      transparent calc(var(--cell) - 1px),
      var(--line) calc(var(--cell) - 1px),
      var(--line) var(--cell)
    ),
    repeating-linear-gradient(to right,
      transparent 0,
      transparent calc(var(--major) - 1px),
      var(--line2) calc(var(--major) - 1px),
      var(--line2) var(--major)
    ),
    repeating-linear-gradient(to bottom,
      transparent 0,
      transparent calc(var(--major) - 1px),
      var(--line2) calc(var(--major) - 1px),
      var(--line2) var(--major)
    );
  will-change: background-position;
}

#shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:6;
  background: radial-gradient(circle at center,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.35) 78%,
    rgba(0,0,0,.7) 100%);
}

/* =========================
   TEXT BOX (NEW)
   ========================= */
.map-textbox{
  position:absolute;
  background:#fff;
  border:1px solid rgba(0,0,0,.15);
  box-sizing:border-box;
  pointer-events:auto;
  z-index:6;
}

.map-textbox-inner{
  height:100%;
  overflow-y:auto;
  padding:18px;

  font-family:"Roboto Mono", monospace;
  font-size:13px;
  line-height:1.6;
  color:#000;

  white-space:pre-wrap;
  -webkit-overflow-scrolling:touch;
  touch-action: pan-y;
}

/* =========================
   (alles andere unverändert)
   ========================= */

/* nodes */
.node{
  position:absolute;
  color:#fff;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
               "Liberation Mono","Courier New", monospace;
  font-size:13px;
  line-height:1.4;
  opacity:.95;
  max-width:340px;
  user-select:none;
  pointer-events:none;
}

/* lines */
#linesCanvas{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

/* image layer */
#imageLayer{
  position:absolute;
  left:0; top:0;
  width:0; height:0;
  pointer-events:none;
  z-index:1;
}

/* video layer */
#videoLayer{
  position:absolute;
  left:0; top:0;
  width:0; height:0;
  pointer-events:none;
  z-index:4;
}

/* … (rest deiner bestehenden Styles bleiben unverändert) */
</style>

<!-- =========================
     JS FILES
     ========================= -->
<script defer src="./js/config.js"></script>
<script defer src="./js/map-core.js"></script>
<script defer src="./js/lines.js"></script>
<script defer src="./js/images.js"></script>
<script defer src="./js/youtube.js"></script>
<script defer src="./js/flipbook.js"></script>
<script defer src="./js/poem-distort.js"></script>
<script defer src="./js/p5-game.js"></script>
<script defer src="./js/gen-poem.js"></script>
<script defer src="./js/textBox.js"></script>

<script>
  window.POEM_SYS_CONFIG = {
    outputId: "autoPoem",
    statusId: "autoStatus"
  };
</script>
<script defer src="./js/poem-system.js"></script>

</head>

<body>
  <div id="viewport">
    <canvas id="linesCanvas"></canvas>

    <div id="world">
      <div class="node" style="left:0px; top:0px;">start (0,0)</div>

      <div id="imageLayer"></div>
      <div id="videoLayer"></div>

      <!-- deine POIs bleiben unverändert -->
    </div>

    <div id="grid"></div>
    <div id="shade"></div>
  </div>
</body>
</html>
